<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Bible Peruser</title>
    <link rel="icon" type="image/png" href="images/Gg.png" />
    <link rel="shortcut icon" type="image/png" href="images/Gg.png" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bp-mobile-overlay">
      <div class="bp-mobile-overlay__msg">
        Bible Peruser<br />
        requires a wider screen.
      </div>
      <div class="bp-mobile-overlay__actions">
        <button class="bp-mobile-overlay__btn" id="bp-copy-btn">
          Copy Address
        </button>
        <button class="bp-mobile-overlay__btn" id="bp-share-btn">Share</button>
      </div>
      <div class="bp-mobile-overlay__logo">
        <a href="https://gospelgo.org" target="_blank" rel="noopener">
          <img src="images/gospelgo-logo.png" alt="Gospelgo" />
        </a>
      </div>
    </div>
    <div class="bp-app">
      <header class="bp-header">
        <h1 class="bp-header__title">
          Bible Peruser
          <a
            href="https://gospelgo.org"
            target="_blank"
            rel="noopener"
            class="bp-header__brand-link"
            aria-label="Gospelgo"
          >
            <img
              src="images/Gg.png"
              alt="Gospelgo"
              class="bp-header__brand-logo"
            />
          </a>
        </h1>
        <form
          class="bp-header__jump"
          id="bp-header-jump-form"
          autocomplete="off"
        >
          <input
            id="bp-header-jump-input"
            class="bp-header__jump-input"
            type="text"
            inputmode="text"
            spellcheck="false"
            aria-label="Jump to book and chapter"
            placeholder="Jump: mat4"
          />
          <button
            id="bp-header-jump-btn"
            class="bp-header__jump-btn"
            type="submit"
            aria-label="Jump to chapter"
            title="Jump to chapter"
          >
            Go
          </button>
        </form>
        <div class="bp-header__nav-center">
          <div
            class="bp-header__nav-group"
            style="display: flex; align-items: center; gap: 0.5em"
          >
            <button id="bp-nav-back" title="Back" aria-label="Back">
              &#8592;
            </button>
            <span class="bp-header__nav-label">Navigation</span>
            <button id="bp-nav-forward" title="Forward" aria-label="Forward">
              &#8594;
            </button>
          </div>
          <div
            class="bp-header__chapter-group"
            style="
              display: flex;
              align-items: center;
              gap: 0.5em;
              margin-left: 2.5em;
            "
          >
            <button
              id="bp-chapter-prev"
              title="Previous Chapter"
              aria-label="Previous Chapter"
            >
              &#8592;
            </button>
            <span class="bp-header__chapter-label">Chapter</span>
            <button
              id="bp-chapter-next"
              title="Next Chapter"
              aria-label="Next Chapter"
            >
              &#8594;
            </button>
          </div>
        </div>
        <div class="bp-header__right">
          <button
            id="bp-copy-link-btn"
            class="bp-header__copy-link-btn"
            title="Copy chapter link"
            aria-label="Copy chapter link"
          >
            Copy Link
          </button>
          <div class="bp-header__resource-links">
            <a
              href="https://bible-explorer.gospelgo.org/"
              target="_blank"
              rel="noopener noreferrer"
              class="bp-header__explorer-link"
              >Bible Explorer</a
            >
            <a
              href="https://bereanbible.com/"
              target="_blank"
              rel="noopener"
              class="bp-header__berean-link"
              style="
                color: var(--accent);
                font-weight: bold;
                text-decoration: underline;
              "
              >Berean Standard Bible</a
            >
            <div class="bp-header__info"><small>Best in 4K</small></div>
          </div>
        </div>
      </header>
      <button
        class="bp-drawer-handle bp-drawer-handle--top"
        id="bp-drawer-top-toggle"
        aria-expanded="false"
        aria-controls="bp-drawer-top"
      >
        <span class="bp-drawer-handle__label">Outline</span>
        <span class="bp-drawer-handle__chevron">&#9662;</span>
      </button>
      <div class="bp-layout-container">
        <div class="bp-layout">
          <nav class="bp-sidebar bp-sidebar--left" id="bp-drawer-top">
            <!-- Navigation will go here -->
          </nav>
          <main class="bp-main">
            <!-- Main Bible content will go here -->
          </main>
          <aside class="bp-sidebar bp-sidebar--right" id="bp-drawer-bottom">
            <div class="bp-sidebar-sticky-controls">
              <div class="sticky-highlight-toggle-bar">
                <label class="sticky-highlight-toggle-label">
                  <input type="checkbox" id="sticky-highlight-toggle" />
                  <span>Sticky Highlights</span>
                </label>
              </div>
            </div>
            <div class="bp-sidebar__scroll-body">
              <!-- Notes/context info will go here -->
            </div>
          </aside>
        </div>
        <div class="bp-book-scrollbar-container">
          <div id="bp-book-scrollbar" class="bp-book-scrollbar"></div>
        </div>
      </div>
      <button
        class="bp-drawer-handle bp-drawer-handle--bottom"
        id="bp-drawer-bottom-toggle"
        aria-expanded="false"
        aria-controls="bp-drawer-bottom"
      >
        <span class="bp-drawer-handle__label">Highlights</span>
        <span class="bp-drawer-handle__chevron">&#9652;</span>
      </button>
      <div class="bp-footer__legend"></div>
      <footer class="bp-footer">
        <span id="bp-char-count">Character count: 0</span>
        <div class="bp-meta-btn-row" id="bp-meta-btn-row"></div>
      </footer>
    </div>
    <script type="module" src="js/bible-loader.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
